[project]
name = "allie"
version = "0.1.0"
description = "A gradually-typed DSL for quantitative trading research, with first-class backtesting semantics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayush Mondal" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
allie = "allie.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "allie",
    "allie.lexer",
    "allie.parser",
    "allie.ast",
    "allie.semantic",
    "allie.typechecker",
    "allie.ir",
    "allie.optimizer",
    "allie.codegen",
    "allie.runtime",
    "allie.runtime.interpreter",
    "allie.runtime.values",
    "allie.runtime.errors",
    "allie.stdlib",
    "allie.quant",
    "allie.quant.types",
    "allie.quant.indicators",
    "allie.quant.backtest",
    "allie.quant.stats",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
# N818: control-flow signals (Break/Continue/ReturnSignal) are deliberately
# not named *Error -- they are never surfaced to the user, same precedent
# as StopIteration in the standard library.
ignore = ["N818"]

[tool.mypy]
# 3.12, not 3.11 (our actual minimum -- see requires-python above):
# numpy's bundled type stubs use PEP 695 `type` statement syntax that
# mypy only parses under a 3.12+ target. Our own code doesn't use any
# 3.12-only syntax, so this doesn't mask real 3.11-incompatibilities.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/", "benchmarks/", "examples/"]

[[tool.mypy.overrides]]
# Phase 1 evaluates untyped `Node = tuple[Any, ...]` trees by design (see
# docs/architecture.md), so every node[i] access is legitimately Any --
# warn_return_any would fire on nearly every return in this module. Revisit
# once Phase 2 replaces hand-built tuples with a typed AST.
module = "allie.runtime.interpreter"
warn_return_any = false
