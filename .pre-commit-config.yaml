# The hooks run the project's own tools, at the versions in uv.lock, so a
# commit is checked by exactly what CI runs: one set of pins, not two to
# drift apart. (Separate pins here had fallen to ruff 0.6 and mypy 1.11
# against a lock on 0.16 and 2.3, and mypy ran without the project's
# dependencies installed.)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
